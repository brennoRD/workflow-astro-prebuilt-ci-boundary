name: Deploy owned prebuilt fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pull production configuration
        run: npx --no-install vercel pull --yes --environment=production

      - name: Build outside Vercel
        run: npx --no-install vercel build --prod

      - name: Show sanitized build layout
        run: node scripts/show-build-layout.mjs

      - name: Deploy prebuilt output
        run: npx --no-install vercel deploy --prebuilt --prod
